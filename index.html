<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف الموسيقار محمد الأمين</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="hero-section" style="background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('assets/img/hero.jpg');">
        <div class="container">
            <nav>
                <div class="logo">أرشيف ود اللمين</div>
            </nav>
            <div class="hero-content">
                <h1>موسوعة كلمات أغاني الأستاذ محمد الأمين</h1>
                <p>إرث فني خالد.. ندوّنه للأجيال</p>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="ابحث عن أغنية (مثلاً: زاد الشجون)...">
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="songsList" class="songs-grid">
            </section>

        <div id="lyricsModal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h2 id="modalTitle"></h2>
                <div id="modalLyrics" class="lyrics-text"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <img src="assets/img/profile.jpg" alt="محمد الأمين" class="footer-avatar">
            <p>جميع الحقوق محفوظة &copy; 2026 - أرشيف محمد الأمين</p>
            <p>تم التطوير بواسطة <span class="developer-name">amrokhal</span></p>

            <div class="visitor-counter" style="margin-top: 20px; border-top: 1px solid #444; pt-3">
                <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 10px;">عدد محبي الموسيقار الذين زاروا الأرشيف:</p>
                <a href="https://www.hitwebcounter.com" target="_blank">
                    <img src="https://hitwebcounter.com/counter/counter.php?page=mohamed-alamin-archive&style=0005&nbdigits=5&type=page&initCount=0" title="Free Counter" Alt="web counter" border="0" />
                </a>
            </div>
            </div>
    </footer>

    <script src="assets/js/app.js"></script>
</body>
</html>
